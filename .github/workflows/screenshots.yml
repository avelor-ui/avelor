name: Screenshots

# Generates the screenshot baselines for tests/e2e/blocks.spec.ts on Linux,
# the only platform where those assertions run. Dispatch it with the branch
# that holds the harness, download the artifact, review the PNGs and commit
# them to that branch. Adding the "screenshots" label to a pull request does
# the same for the PR branch.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to screenshot
        required: true
        default: main
  pull_request:
    types: [labeled]

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm test:e2e tests/e2e/blocks.spec.ts --update-snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 14
